name: KillZone cleanup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean game branding and wire staff controls
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [Path('games/Minecraft-ErrorArea.html'), Path('games/counter_strike_ErrorArea.html')]
          replacements = {
              'create by ErrorArea':'KILLZONE // ORIGINAL GAME',
              'Counter-Strike ErrorArea':'Counter-Strike // KILLZONE',
              '<title>بازی سه‌بعدی ماینکرافت وب</title>':'<title>Minecraft 3D // KILLZONE</title>',
          }
          for path in files:
              text = path.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  text = text.replace(old, new)
              text = text.replace('https://www.youtube.com/@ErrorArea', '#')
              path.write_text(text, encoding='utf-8')

          members = Path('members.html')
          text = members.read_text(encoding='utf-8')
          needle = '<script defer src="/js/members-page-fixes.js?v=1"></script>'
          if needle in text and '/js/staff-permissions.js' not in text:
              text = text.replace(needle, needle + '<script defer src="/js/staff-permissions.js?v=1"></script>')
          members.write_text(text, encoding='utf-8')
          PY
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/Minecraft-ErrorArea.html games/counter_strike_ErrorArea.html members.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: remove legacy game branding and enable staff controls"
          git push