name: Refactor JavaScript

on:
  push:
    branches:
      - refactor/js-cleanup-2026-09-10
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Remove stale renderer
        run: rm -f js/members-page.js

      - name: Format JavaScript
        run: npx --yes prettier@3.6.2 --write "js/**/*.js"

      - name: Syntax check JavaScript
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find js -type f -name '*.js' -print0)

      - name: Verify no whitespace errors
        run: git diff --check

      - name: Commit formatted JavaScript
        shell: bash
        run: |
          if git diff --quiet -- js; then
            echo "No JavaScript formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js
          git commit -m "refactor: normalize JavaScript structure and formatting"
          git push