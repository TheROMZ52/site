name: Package KillZone Site

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build root-level ZIP
        run: |
          rm -rf .git .github
          zip -r "KillZone-Site-${GITHUB_REF_NAME}.zip" . -x "*.zip"

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: KillZone-Site-${{ github.ref_name }}
          path: KillZone-Site-${{ github.ref_name }}.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: KillZone-Site-${{ github.ref_name }}.zip
          generate_release_notes: true
