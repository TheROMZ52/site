name: Package KillZone Site

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build root-level ZIP
        run: |
          mkdir -p dist
          zip -r "dist/KillZone-Site-Latest.zip" . -x ".git/*" ".github/*" "*.zip" "dist/*"

      - name: Upload ZIP file
        uses: actions/upload-artifact@v4
        with:
          name: KillZone-Site-Latest
          path: dist/KillZone-Site-Latest.zip
          if-no-files-found: error
          retention-days: 30
