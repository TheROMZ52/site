/* ===== کارت اعضا: فشرده‌تر، تمیزتر و چندستونه ===== */
.member-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,220px));justify-content:start;gap:14px;}
.member-tile{width:100%;min-height:206px;display:flex;flex-direction:column;align-items:center;text-align:center;padding:18px 14px 14px;background:linear-gradient(145deg,var(--panel),var(--panel-2));border:1px solid var(--line);border-top:2px solid var(--line);position:relative;overflow:hidden;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;}
.member-tile::before{content:'';position:absolute;inset:0 0 auto;height:3px;background:var(--ember);opacity:.65;}
.member-tile:hover{transform:translateY(-3px);border-color:var(--ember);box-shadow:0 8px 22px rgba(0,0,0,.22);}
.avatar{width:72px;height:72px;margin:0 auto 13px;}
.member-tile h4{margin:0 0 7px;font-size:15px;font-weight:800;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.member-tile .game-tag{margin-bottom:auto;}
.member-actions{width:100%;margin-top:12px;}
@media (max-width:760px){.member-grid{grid-template-columns:repeat(2,minmax(0,1fr));justify-content:stretch;}.member-tile{min-width:0;}}
@media (max-width:430px){.member-grid{grid-template-columns:1fr;}.member-tile{max-width:none;}}
</style></head><body>
