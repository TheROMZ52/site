<div class="overlay" id="loginOverlay"><div class="modal"><button class="close" id="loginClose">✕</button><h3>ورود به اکانت</h3><div class="form-grid"><div class="field"><label>نام‌کاربری</label><input type="text" id="loginUser"></div><div class="field"><label>رمز عبور</label><input type="password" id="loginPass"></div><button class="btn primary" id="loginSubmit">ورود</button><div id="loginMsg"></div><div class="hint">عضو نیستی؟ <a href="/register">ورود مهمان</a></div></div></div></div>
