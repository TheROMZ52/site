                    fData.flame.scale.set(scaleXZ, scaleY, scaleXZ);
                    fData.innerFlame.scale.set(scaleXZ, scaleY, scaleXZ);

                    const light = this.fireLights.get(key);
                    if (light) {
                        light.intensity = 2.4 + Math.sin(now * 4 + fData.x * 2) * 0.25;
                    }

                    if (Math.random() < 0.08 && particleIdx < 90) {
                        this.smokeParticles.push({
                            x: fData.x + (Math.random() - 0.5) * 0.15,
                            y: fData.y + 0.2,
                            z: fData.z + (Math.random() - 0.5) * 0.15,
                            vy: 0.25 + Math.random() * 0.2,
                            life: 1.0
                        });
                    }
                });

                for (let i = this.smokeParticles.length - 1; i >= 0; i--) {
                    const p = this.smokeParticles[i];
                    p.y += p.vy * dt;
                    p.life -= dt * 0.6;

                    if (p.life <= 0 || particleIdx >= 100) {
                        this.smokeParticles.splice(i, 1);
                        continue;
                    }

                    dummy.position.set(p.x, p.y, p.z);
                    const s = p.life * 0.09;
                    dummy.scale.set(s, s, s);
                    dummy.updateMatrix();
                    this.smokeInstancedMesh.setMatrixAt(particleIdx++, dummy.matrix);
                }

                this.smokeInstancedMesh.count = particleIdx;
                this.smokeInstancedMesh.instanceMatrix.needsUpdate = true;
            }

            // ساخت کامل در با هم‌راستاسازی زاویه نگاه بازیکن هنگام کاشتن و چرخش صحیح لولا
            createDoorMesh(x, y, z, facing = 0) {
                const key = this.getKey(x, y, z);
                const doorGroup = new THREE.Group();
                doorGroup.position.set(x + 0.5, y, z + 0.5);
                doorGroup.rotation.y = facing * (Math.PI / 2);

                const hingeGroup = new THREE.Group();
                hingeGroup.position.set(-0.44, 0, -0.46);

                const doorGeo = new THREE.BoxGeometry(0.12, 1.98, 0.92);
                const doorMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 0.8, map: Textures.woodSide });
                const doorMesh = new THREE.Mesh(doorGeo, doorMat);
                doorMesh.castShadow = true;
                doorMesh.receiveShadow = true;
                doorMesh.position.set(0, 0.99, 0.46);

                hingeGroup.add(doorMesh);
                doorGroup.add(hingeGroup);

                this.scene.add(doorGroup);
                this.doorMeshes.set(key, { group: doorGroup, hinge: hingeGroup });
                this.doorsState.set(key, { open: false, facing: facing });
            }

            toggleDoor(x, y, z) {
                const key = this.getKey(x, y, z);
                if (!this.doorMeshes.has(key)) return;

                const doorData = this.doorsState.get(key) || { open: false, facing: 0 };
                const isOpen = typeof doorData === 'boolean' ? !doorData : !doorData.open;
                
                if (typeof doorData === 'boolean') {
                    this.doorsState.set(key, { open: isOpen, facing: 0 });
                } else {
                    doorData.open = isOpen;
                    this.doorsState.set(key, doorData);
                }

                const doorObj = this.doorMeshes.get(key);
                if (doorObj && doorObj.hinge) {
                    doorObj.hinge.rotation.y = isOpen ? -Math.PI / 2 : 0;
                }
                audio.playDoor();
            }

            isDoorOpen(x, y, z) {
                const key = this.getKey(x, y, z);
                const doorData = this.doorsState.get(key);
                return doorData ? (typeof doorData === 'boolean' ? doorData : doorData.open) : false;
            }

            generateChunk(cx, cz) {
                const chunkKey = this.getChunkKey(cx, cz);
                if (this.generatedChunks.has(chunkKey)) return;
                this.generatedChunks.add(chunkKey);

                const startX = cx * CHUNK_SIZE;
                const startZ = cz * CHUNK_SIZE;

                for (let x = startX; x < startX + CHUNK_SIZE; x++) {
                    for (let z = startZ; z < startZ + CHUNK_SIZE; z++) {
                        let height = pseudoNoise(x, z);
                        for (let y = 0; y < WORLD_HEIGHT; y++) {
                            const key = this.getKey(x, y, z);
                            if (this.blocks.has(key)) continue;
                            if (y <= height) {
                                if (y === height && y >= WATER_LEVEL) {
                                    this.blocks.set(key, BLOCK.GRASS);
                                    if (Math.random() < 0.015 && Math.abs(x) > 3 && Math.abs(z) > 3) this.generateTree(x, y + 1, z);
                                } else if (y > height - 3) {
                                    this.blocks.set(key, BLOCK.DIRT);
                                } else {
                                    this.blocks.set(key, BLOCK.STONE);
                                }
                            } else if (y <= WATER_LEVEL) {
                                this.blocks.set(key, BLOCK.WATER);
                            }
                        }
                    }
                }
                this.dirty = true;
            }

            generateTree(tx, ty, tz) {
                const trunkHeight = 4 + Math.floor(Math.random() * 2);
                for (let i = 0; i < trunkHeight; i++) this.blocks.set(this.getKey(tx, ty + i, tz), BLOCK.WOOD);
                for (let lx = -2; lx <= 2; lx++) {
                    for (let lz = -2; lz <= 2; lz++) {
                        for (let ly = trunkHeight - 2; ly <= trunkHeight + 1; ly++) {
                            if (Math.abs(lx) === 2 && Math.abs(lz) === 2 && Math.random() < 0.5) continue;
                            const k = this.getKey(tx + lx, ty + ly, tz + lz);
                            if (!this.blocks.has(k)) this.blocks.set(k, BLOCK.LEAVES);
                        }
                    }
                }
            }

            updateChunksAroundPlayer(playerX, playerZ) {
                const pcx = Math.floor(playerX / CHUNK_SIZE);
                const pcz = Math.floor(playerZ / CHUNK_SIZE);
                for (let cx = pcx - VIEW_DISTANCE; cx <= pcx + VIEW_DISTANCE; cx++) {
                    for (let cz = pcz - VIEW_DISTANCE; cz <= pcz + VIEW_DISTANCE; cz++) this.generateChunk(cx, cz);
                }
            }

            rebuildMesh(scene) {
                Object.values(this.instancedMeshes).forEach(mesh => scene.remove(mesh));
                this.instancedMeshes = {};

                const typeCounts = {};
                this.blocks.forEach((type) => {
                    if (type === BLOCK.AIR || type === BLOCK.DOOR || type === BLOCK.TORCH || type === BLOCK.FIRE) return;
                    typeCounts[type] = (typeCounts[type] || 0) + 1;
                });

                const boxGeo = new THREE.BoxGeometry(1, 1, 1);
                const matrices = {};

                Object.keys(typeCounts).forEach(typeStr => {
                    const type = parseInt(typeStr);
                    const count = typeCounts[type];
                    const data = BLOCK_DATA[type];
                    if (!data) return;

                    let mat;
                    if (data.isMultiMat) {
                        if (type === BLOCK.GRASS) {
                            const grassSideM = new THREE.MeshStandardMaterial({ map: Textures.grassSide, roughness: 0.8 });
                            const grassTopM = new THREE.MeshStandardMaterial({ map: Textures.grassTop, roughness: 0.8 });
                            const dirtM = new THREE.MeshStandardMaterial({ map: Textures.dirt, roughness: 0.9 });
                            mat = [grassSideM, grassSideM, grassTopM, dirtM, grassSideM, grassSideM];
                        } else if (type === BLOCK.WOOD) {
                            const sideM = new THREE.MeshStandardMaterial({ map: Textures.woodSide, roughness: 0.85 });
                            const topM = new THREE.MeshStandardMaterial({ map: Textures.woodTop, roughness: 0.85 });
                            mat = [sideM, sideM, topM, topM, sideM, sideM];
                        }
                    } else if (data.isLeaves) {
                        mat = new THREE.MeshStandardMaterial({
                            color: data.color, map: leavesTexture, transparent: true, alphaTest: 0.3, side: THREE.DoubleSide, roughness: 0.8
                        });
                    } else if (type === BLOCK.WATER) {
                        mat = new THREE.MeshStandardMaterial({
                            color: 0x2563eb,
                            map: Textures.water,
                            transparent: true,
                            opacity: 0.65,
                            roughness: 0.1,
                            depthWrite: false,
                            side: THREE.DoubleSide
                        });
                    } else {
                        mat = new THREE.MeshStandardMaterial({
                            color: data.color,
                            map: data.tex || null,
                            roughness: data.roughness !== undefined ? data.roughness : (data.transparent ? 0.1 : 0.7),
                            metalness: data.metalness !== undefined ? data.metalness : 0.1,
                            transparent: data.transparent || false,
                            opacity: data.opacity || 1.0,
                            depthWrite: true, depthTest: true
                        });
                    }

                    const instancedMesh = new THREE.InstancedMesh(boxGeo, mat, count);
                    instancedMesh.castShadow = !data.transparent;
                    instancedMesh.receiveShadow = true;
                    this.instancedMeshes[type] = instancedMesh;
                    matrices[type] = { mesh: instancedMesh, index: 0 };
                });

                const dummy = new THREE.Object3D();

                this.blocks.forEach((type, key) => {
                    if (type === BLOCK.AIR || type === BLOCK.DOOR || type === BLOCK.TORCH || type === BLOCK.FIRE) return;
                    const [x, y, z] = key.split(',').map(Number);

                    if (!BLOCK_DATA[type]?.transparent) {
                        const top = this.getBlock(x, y + 1, z);
                        const bottom = this.getBlock(x, y - 1, z);
                        const left = this.getBlock(x - 1, y, z);
                        const right = this.getBlock(x + 1, y, z);
                        const front = this.getBlock(x, y, z + 1);
                        const back = this.getBlock(x, y, z - 1);

                        if (top && bottom && left && right && front && back &&
                            !BLOCK_DATA[top]?.transparent && !BLOCK_DATA[bottom]?.transparent &&
                            !BLOCK_DATA[left]?.transparent && !BLOCK_DATA[right]?.transparent &&
                            !BLOCK_DATA[front]?.transparent && !BLOCK_DATA[back]?.transparent) return;
                    }

                    dummy.position.set(x + 0.5, y + 0.5, z + 0.5);
                    dummy.updateMatrix();

                    const item = matrices[type];
                    if (item) item.mesh.setMatrixAt(item.index++, dummy.matrix);
                });

                Object.values(matrices).forEach(item => {
                    item.mesh.count = item.index;
                    item.mesh.instanceMatrix.needsUpdate = true;
                    scene.add(item.mesh);
                });

                this.dirty = false;
            }

            saveState() {
                const blockArray = [];
                this.blocks.forEach((type, key) => {
                    blockArray.push([key, type]);
                });

                const customBlocks = [];
                Object.keys(BLOCK_DATA).forEach(typeStr => {
                    const type = parseInt(typeStr);
                    if (type >= 100) {
                        const d = BLOCK_DATA[type];
                        customBlocks.push([type, { name: d.name, color: d.color, transparent: d.transparent, hardness: d.hardness }]);
                    }
                });

                const doorsArray = [];
                this.doorsState.forEach((data, key) => {
                    doorsArray.push([key, data]);
                });

                return {
                    blocks: blockArray,
                    doorsData: doorsArray,
                    generatedChunks: Array.from(this.generatedChunks),
                    customBlockCounter: this.customBlockCounter,
                    customBlocks: customBlocks
                };
            }

            loadState(data) {
                if (!data) return false;
                
                try {
                    this.torchLights.forEach(light => this.scene.remove(light));
                    this.torchLights.clear();
                    this.torchMeshes.forEach(mesh => this.scene.remove(mesh));
                    this.torchMeshes.clear();

                    this.fireLights.forEach(light => this.scene.remove(light));
                    this.fireLights.clear();
                    this.fireMeshes.forEach(fData => this.scene.remove(fData.group));
                    this.fireMeshes.clear();

                    this.doorMeshes.forEach(doorObj => {
                        const grp = doorObj.group || doorObj;
                        this.scene.remove(grp);
                    });
                    this.doorMeshes.clear();
                    this.doorsState.clear();

                    this.blocks.clear();
                    this.generatedChunks.clear();

                    this.customBlockCounter = data.customBlockCounter || 100;

                    if (data.customBlocks) {
                        data.customBlocks.forEach(([id, bData]) => {
                            BLOCK_DATA[id] = bData;
                            BLOCK_DATA[id].iconUrl = generateItemIcon(id);
                        });
                    }

                    if (data.generatedChunks) {
                        data.generatedChunks.forEach(c => this.generatedChunks.add(c));
                    }

                    if (data.blocks) {
                        data.blocks.forEach(([key, type]) => {
                            const [x, y, z] = key.split(',').map(Number);
                            this.setBlock(x, y, z, type, true);
                        });
                    }

                    if (data.doorsData) {
                        data.doorsData.forEach(([key, dData]) => {
                            const [x, y, z] = key.split(',').map(Number);
                            if (this.doorMeshes.has(key)) {
                                this.doorsState.set(key, dData);
                                const doorObj = this.doorMeshes.get(key);
                                if (doorObj) {
                                    doorObj.group.rotation.y = (dData.facing || 0) * (Math.PI / 2);
                                    if (doorObj.hinge) {
                                        doorObj.hinge.rotation.y = dData.open ? -Math.PI / 2 : 0;
                                    }
                                }
                            }
                        });
                    }

                    this.rebuildMesh(this.scene);
                    return true;
                } catch (e) {
                    console.error('Error in loadState', e);
                    return false;
                }
            }
        }

        // --- کلاس اصلی بازی ---
        class Game {
            constructor() {
                this.container = document.getElementById('canvas-container');
                this.hotbarSlots = [BLOCK.GRASS, BLOCK.DIRT, BLOCK.STONE, BLOCK.WOOD, BLOCK.FIRE, BLOCK.TORCH];
                this.activeHotbarIndex = 0;
                this.selectedBlock = this.hotbarSlots[0];
                this.mouseSens = 0.002;
                this.isPaused = true;
                this.isInventoryOpen = false;
                this.inWater = false;
                
                this.keys = {};
                this.isMouseDown = false;
                this.miningProgress = 0;
                
                this.position = new THREE.Vector3(0, 20, 0);
                this.velocity = new THREE.Vector3();
                this.isGrounded = false;
                this.pitch = 0;
                this.yaw = 0;

                this.targetBlock = null;
                this.targetNormal = null;

                this.lastTime = performance.now();
                this.dayTime = 0.3;
                this.swingAnim = 0;

                this.initEngine();
                this.initWorld();
                this.initPlayerHand();
                this.initUI();
                this.initEvents();

                this.loadSavedGame();

                requestAnimationFrame((t) => this.loop(t));
            }

            initEngine() {
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x87ceeb);
                this.scene.fog = new THREE.FogExp2(0x87ceeb, 0.008);

                this.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

                this.renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                
                this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
                this.renderer.toneMappingExposure = 1.0;
                this.renderer.shadowMap.enabled = true;
                this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;

                this.container.appendChild(this.renderer.domElement);

                this.sunLight = new THREE.DirectionalLight(0xfffaed, 1.4);
                this.sunLight.castShadow = true;
                this.sunLight.shadow.mapSize.width = 2048;
                this.sunLight.shadow.mapSize.height = 2048;
                this.sunLight.shadow.camera.near = 1;
                this.sunLight.shadow.camera.far = 160;
                this.sunLight.shadow.bias = -0.0003;
                this.sunLight.shadow.normalBias = 0.03;

                const d = 60;
                this.sunLight.shadow.camera.left = -d; this.sunLight.shadow.camera.right = d;
                this.sunLight.shadow.camera.top = d; this.sunLight.shadow.camera.bottom = -d;
                this.scene.add(this.sunLight);

                this.ambientLight = new THREE.AmbientLight(0x88aacc, 0.45);
                this.scene.add(this.ambientLight);

                const sunGeo = new THREE.SphereGeometry(4, 16, 16);
                const sunMat = new THREE.MeshBasicMaterial({ color: 0xfffaaa });
                this.sunMesh = new THREE.Mesh(sunGeo, sunMat);
                this.scene.add(this.sunMesh);

                const moonGeo = new THREE.SphereGeometry(3, 16, 16);
                const moonMat = new THREE.MeshBasicMaterial({ color: 0xe0e8ff });
                this.moonMesh = new THREE.Mesh(moonGeo, moonMat);
                this.scene.add(this.moonMesh);

                this.cloudsGroup = new THREE.Group();
                const cloudMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.7 });
                for (let i = 0; i < 25; i++) {
                    const cloudGeo = new THREE.BoxGeometry(20 + Math.random() * 30, 3, 15 + Math.random() * 20);
                    const cloud = new THREE.Mesh(cloudGeo, cloudMat);
                    cloud.position.set((Math.random() - 0.5) * 300, 26 + Math.random() * 4, (Math.random() - 0.5) * 300);
                    this.cloudsGroup.add(cloud);
                }
                this.scene.add(this.cloudsGroup);

                const highlightGeo = new THREE.BoxGeometry(1.008, 1.008, 1.008);
                const highlightMat = new THREE.MeshBasicMaterial({ color: 0x000000, wireframe: true, wireframeLinewidth: 2 });
                this.highlightBox = new THREE.Mesh(highlightGeo, highlightMat);
                this.highlightBox.visible = false;
                this.scene.add(this.highlightBox);

                const crackGeo = new THREE.BoxGeometry(1.009, 1.009, 1.009);
                this.crackMat = new THREE.MeshBasicMaterial({ map: crackTextures[0], transparent: true, depthWrite: false });
                this.crackBox = new THREE.Mesh(crackGeo, this.crackMat);
                this.crackBox.visible = false;
                this.scene.add(this.crackBox);
            }

            initWorld() {
                this.world = new World(this.scene);
                this.world.updateChunksAroundPlayer(0, 0);
                this.world.rebuildMesh(this.scene);

                let topY = 16;
                for (let y = WORLD_HEIGHT - 1; y >= 0; y--) {
                    const b = this.world.getBlock(0, y, 0);
                    if (b !== BLOCK.AIR && b !== BLOCK.WATER) {
                        topY = y + 1;
                        break;
                    }
                }
                this.position.set(0, topY + 0.1, 0);
            }

            initPlayerHand() {
                this.handGroup = new THREE.Group();

                const armGeo = new THREE.BoxGeometry(0.2, 0.6, 0.2);
                const armMat = new THREE.MeshStandardMaterial({ color: 0xdbac82, roughness: 0.8 });
                this.arm = new THREE.Mesh(armGeo, armMat);
                this.arm.position.set(0, -0.2, 0);
                this.handGroup.add(this.arm);

                const heldBlockGeo = new THREE.BoxGeometry(0.28, 0.28, 0.28);
                this.heldBlockMat = new THREE.MeshStandardMaterial({ color: 0x55aa33, roughness: 0.8 });
                this.heldBlockMesh = new THREE.Mesh(heldBlockGeo, this.heldBlockMat);
                this.heldBlockMesh.position.set(-0.08, 0.15, -0.22);
                this.handGroup.add(this.heldBlockMesh);

                this.handGroup.position.set(0.38, -0.32, -0.5);
                this.handGroup.rotation.set(0.1, -0.2, 0);

                this.camera.add(this.handGroup);
                this.scene.add(this.camera);

                this.updateHeldBlockMesh();
            }

            updateHeldBlockMesh() {
                const bData = BLOCK_DATA[this.selectedBlock];
                if (bData) {
                    if (this.selectedBlock === BLOCK.BUCKET_EMPTY || this.selectedBlock === BLOCK.BUCKET_WATER) {
                        this.heldBlockMat.color.setHex(this.selectedBlock === BLOCK.BUCKET_WATER ? 0x2563eb : 0xaaaaaa);
                        this.heldBlockMat.map = null;
                        this.heldBlockMat.transparent = false;
                        this.heldBlockMat.opacity = 1.0;
                    } else {
                        this.heldBlockMat.color.setHex(bData.color);
                        this.heldBlockMat.map = bData.tex || (bData.isMultiMat ? Textures.grassTop : null);
                        this.heldBlockMat.transparent = bData.transparent || false;
                        this.heldBlockMat.opacity = bData.opacity || 1.0;
                    }
                    this.heldBlockMat.needsUpdate = true;
                    this.heldBlockMesh.visible = true;
                } else {
                    this.heldBlockMesh.visible = false;
                }
            }

            initUI() {
                this.renderHotbar();
                this.renderInventoryGrid();
            }

            renderHotbar() {
                const hotbarEl = document.getElementById('hotbar');
                hotbarEl.innerHTML = '';

                this.hotbarSlots.forEach((blockType, idx) => {
                    const slot = document.createElement('div');
                    slot.className = `hotbar-slot ${idx === this.activeHotbarIndex ? 'active' : ''}`;
                    const data = BLOCK_DATA[blockType] || { iconUrl: '' };

                    slot.innerHTML = `
                        <span class="hotbar-key">${idx + 1}</span>
                        <div class="block-icon" style="background-image: url('${data.iconUrl}')"></div>
                    `;

                    slot.addEventListener('click', () => this.selectHotbarSlot(idx));
                    hotbarEl.appendChild(slot);
                });

                this.selectedBlock = this.hotbarSlots[this.activeHotbarIndex];
                this.updateHeldBlockMesh();
            }

            selectHotbarSlot(index) {
                this.activeHotbarIndex = index;
                this.renderHotbar();
            }

            renderInventoryGrid() {
                const grid = document.getElementById('inventory-grid');
                grid.innerHTML = '';

                Object.keys(BLOCK_DATA).forEach(typeStr => {
                    const type = parseInt(typeStr);
                    const data = BLOCK_DATA[type];

                    const item = document.createElement('div');
                    item.className = 'inventory-item';

                    item.innerHTML = `
                        <div class="block-icon" style="background-image: url('${data.iconUrl}'); width: 34px; height: 34px;"></div>
                        <label>${data.name}</label>
                    `;

                    item.addEventListener('click', () => {
                        this.hotbarSlots[this.activeHotbarIndex] = type;
                        this.renderHotbar();
                        this.closeInventory();
                    });

                    grid.appendChild(item);
                });
            }

            saveGame() {
                const saveData = {
                    playerPos: { x: this.position.x, y: this.position.y, z: this.position.z },
                    playerRot: { pitch: this.pitch, yaw: this.yaw },
                    hotbarSlots: this.hotbarSlots,
                    activeHotbarIndex: this.activeHotbarIndex,
                    worldData: this.world.saveState(),
                    dayTime: this.dayTime
                };

                try {
                    localStorage.setItem('minecraft_3d_saved_game', JSON.stringify(saveData));
                    this.showToast('بازی با موفقیت ذخیره شد!');
                } catch (e) {
                    this.showToast('خطا در ذخیره‌سازی داده‌ها!');
                }
            }

            loadSavedGame() {
                const savedRaw = localStorage.getItem('minecraft_3d_saved_game');
                if (!savedRaw) return;

                try {
                    const data = JSON.parse(savedRaw);
                    if (data.hotbarSlots) this.hotbarSlots = data.hotbarSlots;
                    if (data.activeHotbarIndex !== undefined) this.activeHotbarIndex = data.activeHotbarIndex;
                    if (data.dayTime !== undefined) this.dayTime = data.dayTime;

                    if (data.worldData) {
                        this.world.loadState(data.worldData);
                    }

                    if (data.playerPos) this.position.set(data.playerPos.x, data.playerPos.y, data.playerPos.z);
                    if (data.playerRot) { this.pitch = data.playerRot.pitch; this.yaw = data.playerRot.yaw; }

                    this.renderHotbar();
                } catch (e) {
                    console.error('Error loading saved game', e);
                }
            }

            resetGameData() {
                localStorage.removeItem('minecraft_3d_saved_game');
                
                this.world.torchLights.forEach(light => this.scene.remove(light));
                this.world.torchLights.clear();
                this.world.torchMeshes.forEach(mesh => this.scene.remove(mesh));
                this.world.torchMeshes.clear();

                this.world.fireLights.forEach(light => this.scene.remove(light));
                this.world.fireLights.clear();
                this.world.fireMeshes.forEach(fData => this.scene.remove(fData.group));
                this.world.fireMeshes.clear();

                this.world.doorMeshes.forEach(doorObj => {
                    const grp = doorObj.group || doorObj;
                    this.scene.remove(grp);
                });
                this.world.doorMeshes.clear();
                this.world.doorsState.clear();

                this.initWorld();
                this.hotbarSlots = [BLOCK.GRASS, BLOCK.DIRT, BLOCK.STONE, BLOCK.WOOD, BLOCK.FIRE, BLOCK.TORCH];
                this.activeHotbarIndex = 0;
                this.renderHotbar();
                this.showToast('تمام داده‌های بازی پاکسازی شدند!');
            }

            showToast(message) {
                const toast = document.getElementById('toast-msg');
                toast.textContent = message;
                toast.style.opacity = '1';
                setTimeout(() => {
                    toast.style.opacity = '0';
                }, 2500);
            }

            initEvents() {
                window.addEventListener('resize', () => {
                    this.camera.aspect = window.innerWidth / window.innerHeight;
                    this.camera.updateProjectionMatrix();
                    this.renderer.setSize(window.innerWidth, window.innerHeight);
                });

                window.addEventListener('keydown', (e) => {
                    this.keys[e.code] = true;

                    if (e.code.startsWith('Digit')) {
                        const num = parseInt(e.code.replace('Digit', '')) - 1;
                        if (num >= 0 && num < 6) this.selectHotbarSlot(num);
                    }

                    if (e.code === 'KeyE') {
                        if (this.isInventoryOpen) this.closeInventory();
                        else this.openInventory();
                    }

                    if (e.code === 'Escape') {
                        if (this.isInventoryOpen) this.closeInventory();
                        else if (!this.isPaused) this.pauseGame();
                    }
                });

                window.addEventListener('keyup', (e) => { this.keys[e.code] = false; });

                window.addEventListener('wheel', (e) => {
                    if (this.isPaused || this.isInventoryOpen) return;
                    if (e.deltaY > 0) this.activeHotbarIndex = (this.activeHotbarIndex + 1) % 6;
                    else this.activeHotbarIndex = (this.activeHotbarIndex - 1 + 6) % 6;
                    this.renderHotbar();
                });

                document.addEventListener('pointerlockchange', () => {
                    if (document.pointerLockElement === document.body) {
                        this.isPaused = false;
                        this.isInventoryOpen = false;
                        document.getElementById('main-menu').classList.add('hidden');
                        document.getElementById('pause-menu').classList.add('hidden');
                        document.getElementById('inventory-menu').classList.add('hidden');
                    } else {
                        if (!this.isInventoryOpen) this.pauseGame();
                    }
                });

                window.addEventListener('mousemove', (e) => {
                    if (this.isPaused || this.isInventoryOpen) return;
                    this.yaw -= e.movementX * this.mouseSens;
                    this.pitch -= e.movementY * this.mouseSens;
                    this.pitch = Math.max(-Math.PI / 2 + 0.01, Math.min(Math.PI / 2 - 0.01, this.pitch));
                });

                window.addEventListener('mousedown', (e) => {
                    if (this.isPaused || this.isInventoryOpen) return;

                    if (this.selectedBlock === BLOCK.BUCKET_EMPTY) {
                        if (this.targetBlock) {
                            const bType = this.world.getBlock(this.targetBlock.x, this.targetBlock.y, this.targetBlock.z);
                            if (bType === BLOCK.WATER) {
                                this.world.setBlock(this.targetBlock.x, this.targetBlock.y, this.targetBlock.z, BLOCK.AIR);
                                this.hotbarSlots[this.activeHotbarIndex] = BLOCK.BUCKET_WATER;
                                this.renderHotbar();
                                audio.playSplash();
                                return;
                            }
                        }
                    } else if (this.selectedBlock === BLOCK.BUCKET_WATER) {
                        if (this.targetBlock && this.targetNormal) {
                            const px = this.targetBlock.x + this.targetNormal.x;
                            const py = this.targetBlock.y + this.targetNormal.y;
                            const pz = this.targetBlock.z + this.targetNormal.z;

                            this.world.setBlock(px, py, pz, BLOCK.WATER);
                            this.hotbarSlots[this.activeHotbarIndex] = BLOCK.BUCKET_EMPTY;
                            this.renderHotbar();
                            audio.playSplash();
                            return;
                        }
                    }

                    if (e.button === 0) {
                        this.isMouseDown = true;
                        this.miningProgress = 0;
                    } else if (e.button === 2) {
                        if (this.targetBlock) {
                            const currentType = this.world.getBlock(this.targetBlock.x, this.targetBlock.y, this.targetBlock.z);
                            if (currentType === BLOCK.DOOR) {
                                this.world.toggleDoor(this.targetBlock.x, this.targetBlock.y, this.targetBlock.z);
                                return;
                            }
                        }

                        if (this.targetBlock && this.targetNormal) {
                            const px = this.targetBlock.x + this.targetNormal.x;
                            const py = this.targetBlock.y + this.targetNormal.y;
                            const pz = this.targetBlock.z + this.targetNormal.z;

                            const pBox = this.getPlayerAABB(this.position);
                            const blockBox = { min: new THREE.Vector3(px, py, pz), max: new THREE.Vector3(px + 1, py + 1, pz + 1) };

                            if (!this.checkAABBOverlap(pBox, blockBox)) {
                                // محاسبه جهت زاویه نگاه نگاه بازیکن هنگام کاشتن در
                                const facing = Math.floor(((this.yaw + Math.PI / 4) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) / (Math.PI / 2));
                                this.world.setBlock(px, py, pz, this.selectedBlock, false, facing);
                                audio.playPlace();
                            }
                        }
                    }
                });

                window.addEventListener('mouseup', (e) => {
                    if (e.button === 0) {
                        this.isMouseDown = false;
                        this.miningProgress = 0;
                        this.crackBox.visible = false;
                    }
                });

                window.addEventListener('contextmenu', e => e.preventDefault());

                document.getElementById('start-btn').addEventListener('click', () => { audio.init(); document.body.requestPointerLock(); });
                document.getElementById('resume-btn').addEventListener('click', () => { document.body.requestPointerLock(); });
                document.getElementById('menu-settings-btn').addEventListener('click', () => {
                    document.getElementById('main-menu').classList.add('hidden');
                    document.getElementById('pause-menu').classList.remove('hidden');
                });
                document.getElementById('close-inventory-btn').addEventListener('click', () => { this.closeInventory(); });

                document.getElementById('save-btn').addEventListener('click', () => {
                    this.saveGame();
                });

                document.getElementById('reset-btn').addEventListener('click', () => {
                    this.resetGameData();
                });

                document.getElementById('add-color-btn').addEventListener('click', () => {
                    const hexColor = document.getElementById('custom-color').value;
                    const colorNum = parseInt(hexColor.replace('#', '0x'));
                    
                    const newBlockId = this.world.customBlockCounter++;
                    BLOCK_DATA[newBlockId] = { name: 'رنگ سفارشی', color: colorNum, transparent: false, hardness: 0.5 };
                    BLOCK_DATA[newBlockId].iconUrl = generateItemIcon(newBlockId);

                    this.hotbarSlots[this.activeHotbarIndex] = newBlockId;
                    this.renderHotbar();
                    this.renderInventoryGrid();
                    this.closeInventory();
                });

                document.getElementById('sens-slider').addEventListener('input', (e) => { this.mouseSens = (e.target.value / 5) * 0.002; });
                document.getElementById('fov-slider').addEventListener('input', (e) => { this.camera.fov = parseFloat(e.target.value); this.camera.updateProjectionMatrix(); });
                document.getElementById('shadows-toggle').addEventListener('change', (e) => { this.renderer.shadowMap.enabled = e.target.checked; this.world.dirty = true; });
                document.getElementById('sound-toggle').addEventListener('change', (e) => { audio.enabled = e.target.checked; });
            }

            openInventory() {
                this.isInventoryOpen = true;
                document.exitPointerLock();
                document.getElementById('inventory-menu').classList.remove('hidden');
            }

            closeInventory() {
                this.isInventoryOpen = false;
                document.getElementById('inventory-menu').classList.add('hidden');
                document.body.requestPointerLock();
            }

            pauseGame() {
                this.isPaused = true;
                document.exitPointerLock();
                document.getElementById('pause-menu').classList.remove('hidden');
            }

            getPlayerAABB(pos) {
                const halfW = PLAYER.WIDTH / 2;
                const halfD = PLAYER.DEPTH / 2;
                return {
                    min: new THREE.Vector3(pos.x - halfW, pos.y, pos.z - halfD),
                    max: new THREE.Vector3(pos.x + halfW, pos.y + PLAYER.HEIGHT, pos.z + halfD)
                };
            }

            checkAABBOverlap(a, b) {
                return (
                    a.min.x < b.max.x && a.max.x > b.min.x &&
                    a.min.y < b.max.y && a.max.y > b.min.y &&
                    a.min.z < b.max.z && a.max.z > b.min.z
                );
            }

            updatePhysics(dt) {
                if (this.isPaused || this.isInventoryOpen) return;

                const headBlock = this.world.getBlock(this.position.x, this.position.y + PLAYER.EYE_HEIGHT, this.position.z);
                const feetBlock = this.world.getBlock(this.position.x, this.position.y + 0.2, this.position.z);
                
                const wasInWater = this.inWater;
                this.inWater = (headBlock === BLOCK.WATER || feetBlock === BLOCK.WATER);

                if (!wasInWater && this.inWater) audio.playSplash();

                const overlay = document.getElementById('underwater-overlay');
                overlay.style.opacity = headBlock === BLOCK.WATER ? '1' : '0';

                const forward = new THREE.Vector3(-Math.sin(this.yaw), 0, -Math.cos(this.yaw)).normalize();
                const right = new THREE.Vector3(Math.cos(this.yaw), 0, -Math.sin(this.yaw)).normalize();

                const moveDir = new THREE.Vector3();
                if (this.keys['KeyW']) moveDir.add(forward);
                if (this.keys['KeyS']) moveDir.sub(forward);
                if (this.keys['KeyD']) moveDir.add(right);
                if (this.keys['KeyA']) moveDir.sub(right);
                moveDir.normalize();

                const speed = this.inWater ? PLAYER.WATER_SPEED : PLAYER.SPEED;
                
                this.velocity.x = moveDir.x * speed;
                this.velocity.z = moveDir.z * speed;

                const gravity = this.inWater ? PLAYER.WATER_GRAVITY : PLAYER.GRAVITY;

                if (this.inWater) {
                    if (this.keys['Space']) this.velocity.y = 3.2;
                    else this.velocity.y -= gravity * dt * 0.3;
                    this.velocity.y = THREE.MathUtils.clamp(this.velocity.y, -2.5, 3.2);
                } else {
                    this.velocity.y -= gravity * dt;
                    if (this.keys['Space'] && this.isGrounded) {
                        this.velocity.y = PLAYER.JUMP_VELOCITY;
                        this.isGrounded = false;
                    }
                }

                const moveStep = this.velocity.clone().multiplyScalar(dt);

                this.position.x += moveStep.x;
                let playerBox = this.getPlayerAABB(this.position);
                let bounds = this.getSurroundingBlockBoxes(playerBox);
                for (const box of bounds) {
                    if (this.checkAABBOverlap(playerBox, box)) {
                        if (moveStep.x > 0) this.position.x = box.min.x - PLAYER.WIDTH / 2 - 0.0001;
                        else if (moveStep.x < 0) this.position.x = box.max.x + PLAYER.WIDTH / 2 + 0.0001;
                        this.velocity.x = 0;
                        playerBox = this.getPlayerAABB(this.position);
                    }
                }

                this.position.z += moveStep.z;
                playerBox = this.getPlayerAABB(this.position);
                bounds = this.getSurroundingBlockBoxes(playerBox);
                for (const box of bounds) {
                    if (this.checkAABBOverlap(playerBox, box)) {
                        if (moveStep.z > 0) this.position.z = box.min.z - PLAYER.DEPTH / 2 - 0.0001;
                        else if (moveStep.z < 0) this.position.z = box.max.z + PLAYER.DEPTH / 2 + 0.0001;
                        this.velocity.z = 0;
                        playerBox = this.getPlayerAABB(this.position);
                    }
                }

                this.position.y += moveStep.y;
                this.isGrounded = false;
                playerBox = this.getPlayerAABB(this.position);
                bounds = this.getSurroundingBlockBoxes(playerBox);
                for (const box of bounds) {
                    if (this.checkAABBOverlap(playerBox, box)) {
                        if (moveStep.y > 0) {
                            this.position.y = box.min.y - PLAYER.HEIGHT - 0.0001;
                            this.velocity.y = 0;
                        } else if (moveStep.y < 0) {
                            this.position.y = box.max.y + 0.0001;
                            this.velocity.y = 0;
                            this.isGrounded = true;
                        }
                        playerBox = this.getPlayerAABB(this.position);
                    }
                }

                if (this.position.y < -10) {
                    this.position.set(0, 20, 0);
                    this.velocity.set(0, 0, 0);
                }

                this.camera.position.set(this.position.x, this.position.y + PLAYER.EYE_HEIGHT, this.position.z);
                const euler = new THREE.Euler(this.pitch, this.yaw, 0, 'YXZ');
                this.camera.quaternion.setFromEuler(euler);

                this.world.updateChunksAroundPlayer(this.position.x, this.position.z);
            }

            getSurroundingBlockBoxes(playerBox) {
                const boxes = [];
                const minX = Math.floor(playerBox.min.x) - 1; const maxX = Math.ceil(playerBox.max.x) + 1;
                const minY = Math.floor(playerBox.min.y) - 1; const maxY = Math.ceil(playerBox.max.y) + 1;
                const minZ = Math.floor(playerBox.min.z) - 1; const maxZ = Math.ceil(playerBox.max.z) + 1;

                for (let x = minX; x <= maxX; x++) {
                    for (let y = minY; y <= maxY; y++) {
                        for (let z = minZ; z <= maxZ; z++) {
                            const block = this.world.getBlock(x, y, z);
                            if (block === BLOCK.DOOR) {
                                if (!this.world.isDoorOpen(x, y, z)) {
                                    boxes.push({ min: new THREE.Vector3(x, y, z), max: new THREE.Vector3(x + 1, y + 1, z + 1) });
                                }
                            } else if (block !== BLOCK.AIR && block !== BLOCK.WATER && block !== BLOCK.TORCH && block !== BLOCK.FIRE) {
                                boxes.push({ min: new THREE.Vector3(x, y, z), max: new THREE.Vector3(x + 1, y + 1, z + 1) });
                            }
                        }
                    }
                }
                return boxes;
            }

            updateRaycast() {
                if (this.isPaused || this.isInventoryOpen) {
                    this.highlightBox.visible = false;
                    this.crackBox.visible = false;
                    return;
                }

                const raycaster = new THREE.Raycaster();
                raycaster.setFromCamera(new THREE.Vector2(0, 0), this.camera);
                raycaster.far = 6.0;

                const ray = raycaster.ray;
                const step = 0.05;
                let currentPos = ray.origin.clone();
                let lastBlockPos = null;

                const isHoldingEmptyBucket = (this.selectedBlock === BLOCK.BUCKET_EMPTY);

                for (let d = 0; d < raycaster.far; d += step) {
                    currentPos.addScaledVector(ray.direction, step);
                    const bx = Math.floor(currentPos.x);
                    const by = Math.floor(currentPos.y);
                    const bz = Math.floor(currentPos.z);

                    const block = this.world.getBlock(bx, by, bz);
                    const isHit = (block !== BLOCK.AIR) && (block !== BLOCK.WATER || isHoldingEmptyBucket);

                    if (isHit) {
                        this.targetBlock = { x: bx, y: by, z: bz };
                        if (lastBlockPos) {
                            this.targetNormal = new THREE.Vector3(lastBlockPos.x - bx, lastBlockPos.y - by, lastBlockPos.z - bz);
                        } else {
                            this.targetNormal = new THREE.Vector3(0, 1, 0);
                        }
                        break;
                    }
                    lastBlockPos = { x: bx, y: by, z: bz };
                }

                if (this.targetBlock) {
                    this.highlightBox.position.set(this.targetBlock.x + 0.5, this.targetBlock.y + 0.5, this.targetBlock.z + 0.5);
                    this.highlightBox.visible = true;
                } else {
                    this.highlightBox.visible = false;
                    this.crackBox.visible = false;
                }
            }

            updateMining(dt) {
                if (this.isMouseDown && this.targetBlock) {
                    const { x, y, z } = this.targetBlock;
                    const blockType = this.world.getBlock(x, y, z);
                    const hardness = BLOCK_DATA[blockType]?.hardness || 0.5;

                    this.swingAnim = 0.8;
                    this.miningProgress += dt / hardness;

                    const shakeX = (Math.random() - 0.5) * 0.04;
                    const shakeY = (Math.random() - 0.5) * 0.04;
                    const shakeZ = (Math.random() - 0.5) * 0.04;

                    const stage = Math.min(2, Math.floor(this.miningProgress * 3));
                    this.crackMat.map = crackTextures[stage];
                    this.crackBox.position.set(x + 0.5 + shakeX, y + 0.5 + shakeY, z + 0.5 + shakeZ);
                    this.crackBox.visible = true;

                    if (Math.random() < 0.22) audio.playHit();

                    if (this.miningProgress >= 1.0) {
                        this.world.setBlock(x, y, z, BLOCK.AIR);
                        audio.playBreak();
                        this.miningProgress = 0;
                        this.crackBox.visible = false;
                        this.isMouseDown = false;
                    }
                } else {
                    this.crackBox.visible = false;
                }
            }

            updateLighting(dt) {
                this.dayTime += dt * 0.0018;
                if (this.dayTime > 1) this.dayTime = 0;

                const angle = this.dayTime * Math.PI * 2;
                const orbitRadius = 120;

                this.sunLight.position.x = Math.cos(angle) * orbitRadius + this.position.x;
                this.sunLight.position.y = Math.sin(angle) * orbitRadius;
                this.sunLight.position.z = Math.sin(angle) * 0.5 * orbitRadius + this.position.z;

                this.sunMesh.position.copy(this.sunLight.position);
                this.moonMesh.position.set(
                    -Math.cos(angle) * orbitRadius + this.position.x,
                    -Math.sin(angle) * orbitRadius,
                    -Math.sin(angle) * 0.5 * orbitRadius + this.position.z
                );

                const sunHeight = Math.sin(angle);

                const dayColor = new THREE.Color(0x87ceeb);
                const nightColor = new THREE.Color(0x050a18);
                const sunsetColor = new THREE.Color(0xdd5522);

                let skyColor = new THREE.Color();
                if (sunHeight > 0.2) {
                    skyColor.copy(dayColor);
                } else if (sunHeight > -0.2) {
                    skyColor.lerpColors(sunsetColor, dayColor, (sunHeight + 0.2) / 0.4);
                } else {
                    skyColor.copy(nightColor);
                }

                this.scene.background = skyColor;
                this.scene.fog.color = skyColor;

                this.sunLight.intensity = Math.max(0.06, Math.min(1.4, sunHeight * 1.6));
                this.ambientLight.intensity = Math.max(0.12, sunHeight * 0.45 + 0.2);

                Textures.water.offset.x += dt * 0.03;
                Textures.water.offset.y += dt * 0.02;
            }

            updateHandAnimation(dt) {
                if (this.swingAnim > 0) {
                    this.swingAnim -= dt * 6.0;
                    if (this.swingAnim < 0) this.swingAnim = 0;

                    const swingRot = Math.sin(this.swingAnim * Math.PI);
                    this.handGroup.rotation.x = 0.1 - swingRot * 0.6;
                    this.handGroup.rotation.y = -0.2 + swingRot * 0.3;
                    this.handGroup.position.z = -0.5 + swingRot * 0.12;
                } else {
                    const bob = Math.sin(performance.now() * 0.0025) * 0.015;
                    this.handGroup.position.y = -0.32 + bob;
                    this.handGroup.rotation.set(0.1, -0.2, 0);
                }
            }

            loop(timestamp) {
                requestAnimationFrame((t) => this.loop(t));

                const dt = Math.min((timestamp - this.lastTime) / 1000, 0.1);
                this.lastTime = timestamp;

                if (!this.isPaused && !this.isInventoryOpen) {
                    this.updatePhysics(dt);
                    this.updateRaycast();
                    this.updateMining(dt);
                    this.updateLighting(dt);
                    this.updateHandAnimation(dt);

                    // بروزرسانی انیمیشن آرام آتش و دود
                    this.world.updateFireAnimations(dt, this.position);

                    if (this.world.dirty) {
                        this.world.rebuildMesh(this.scene);
                    }
                }

                this.renderer.render(this.scene, this.camera);
            }
        }

        window.addEventListener('load', () => {
            new Game();
        });
    </script>
