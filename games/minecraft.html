<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Minecraft // KILLZONE</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#10100e;color:#f4eddc;overflow:hidden;font-family:Vazirmatn,Arial,sans-serif}
    .game-frame{position:fixed;inset:0;border:0;width:100%;height:100%;background:#000}
    .return{position:fixed;top:14px;right:14px;z-index:9999;display:inline-flex;align-items:center;gap:8px;padding:9px 12px;background:rgba(16,16,14,.8);border:1px solid #3b362a;color:#f4eddc;text-decoration:none;font-size:12px;backdrop-filter:blur(8px)}
    .return:hover{border-color:#df6330;background:rgba(16,16,14,.94)}
  </style>
</head>
<body>
  <a class="return" href="/games" aria-label="بازگشت به گیم هاب">← گیم هاب</a>
  <iframe id="gameFrame" class="game-frame" src="Minecraft-ErrorArea.html" title="Minecraft KILLZONE" allow="fullscreen; gamepad; pointer-lock" allowfullscreen></iframe>
  <script>
    (function(){
      const frame=document.getElementById('gameFrame');
      function clean(){
        try{
          const doc=frame.contentDocument;
          if(!doc)return;
          doc.title='Minecraft // KILLZONE';
          doc.querySelectorAll('a').forEach(function(a){
            const text=(a.textContent||'').toLowerCase();
            const href=(a.getAttribute('href')||'').toLowerCase();
            if(text.includes('errorarea')||href.includes('errorarea'))a.remove();
          });
          doc.querySelectorAll('*').forEach(function(el){
            if(el.children.length===0 && /errorarea/i.test(el.textContent||'')){
              el.textContent=(el.textContent||'').replace(/errorarea/ig,'KILLZONE');
            }
          });
        }catch(e){ console.warn('KillZone game cleanup unavailable',e); }
      }
      frame.addEventListener('load',clean);
      setTimeout(clean,250);
    })();
  </script>
</body>
</html>
